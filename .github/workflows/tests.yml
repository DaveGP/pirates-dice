name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rules-and-ai:
    name: Rules engine and AI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run tests
        run: dotnet test tests/PiratesDice.Tests/PiratesDice.Tests.csproj --logger "console;verbosity=normal"
